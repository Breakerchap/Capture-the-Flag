name: CaptureTheFlag
version: '2.0.0-SNAPSHOT'
main: io.github.breakerchap.ctf.CaptureTheFlagPlugin
description: Configurable multi-arena Capture the Flag for Paper 26.2
author: Breakerchap
api-version: '26.2'
commands:
  ctf:
    description: Capture the Flag commands
    usage: /ctf help
    aliases: [capturetheflag]
permissions:
  ctf.play:
    description: Join and play CTF arenas
    default: true
  ctf.admin:
    description: Create, configure, start and stop CTF arenas
    default: op
